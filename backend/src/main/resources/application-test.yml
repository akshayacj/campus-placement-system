# ====================================================================================
# TEST PROFILE (application-test.yml)
# ====================================================================================

spring:
  datasource:
    url: jdbc:h2:mem:placement_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.college.placement: DEBUG

