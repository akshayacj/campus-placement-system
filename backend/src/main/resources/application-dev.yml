# ====================================================================================
# DEVELOPMENT PROFILE (application-dev.yml)
# ====================================================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/placement_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:placement_user}
    password: ${SPRING_DATASOURCE_PASSWORD:placement_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    # TECH TALK: Why 'validate' and NOT 'update':
    # In enterprise applications, database schemas must be deterministically versioned
    # and auditable via Flyway migrations. 'ddl-auto: update' produces silent schema drift,
    # does not version-control indexes or constraints, and risks destructive alterations.
    # 'validate' guarantees the JPA entities strictly match the Flyway-migrated schema.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.college.placement: DEBUG
    org.springframework.boot.autoconfigure: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,beans,conditions,env,configprops,mappings,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,resumeStorage

