# ====================================================================================
# PRODUCTION PROFILE (application-prod.yml)
# ====================================================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

placement:
  jwt:
    # In production, secret MUST come from the environment with no fallback default
    secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    com.college.placement: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

